name: Generate & Upload YouTube Shorts

on:
  schedule:
    # 5:30 PM IST = 12:00 PM UTC
    - cron: "0 12 * * *"

  workflow_dispatch:
    inputs:
      demo:
        description: "Run in demo mode"
        required: false
        type: boolean
        default: false

      short:
        description: "Only build a specific short (1-5, leave empty for all)"
        required: false
        type: string
        default: ""

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create required directories
        run: |
          mkdir -p logs
          mkdir -p output/shorts

      - name: Restore YouTube credentials
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          echo "$YOUTUBE_TOKEN" | base64 -d > youtube_token.pickle

      - name: Create environment file
        env:
          ENV_FILE: ${{ secrets.SHORTS_ENV }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env

      - name: Generate and upload Shorts
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "${{ inputs.short }}" ]; then
            python main_shorts.py --short "${{ inputs.short }}"
          elif [ "${{ inputs.demo }}" = "true" ]; then
            python main_shorts.py --demo
          else
            python main_shorts.py
          fi

      - name: Upload generated Shorts as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: |
            output/shorts/
            logs/
          retention-days: 7