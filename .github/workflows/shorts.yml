name: Generate & Upload YouTube Shorts

on:
  schedule:
    # 5:30 PM IST = 12:00 PM UTC
    # Monday-Friday only
    - cron: "0 12 * * 1-5"

  workflow_dispatch:
    inputs:
      demo:
        description: "Run in demo mode"
        required: false
        type: boolean
        default: false

      short:
        description: "Only build a specific short (1-5), leave empty for all"
        required: false
        type: string
        default: ""

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create required directories
        run: |
          mkdir -p logs
          mkdir -p output/shorts

      - name: Restore YouTube token
        env:
          YOUTUBE_TOKEN_PICKLE_B64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}
        run: |
          echo "$YOUTUBE_TOKEN_PICKLE_B64" | base64 -d > youtube_token.pickle

      - name: Restore YouTube client secret
        env:
          CLIENT_SECRET_JSON_B64: ${{ secrets.CLIENT_SECRET_JSON_B64 }}
        run: |
          echo "$CLIENT_SECRET_JSON_B64" | base64 -d > client_secret.json

      - name: Create environment file
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          YOUTUBE_UPLOAD: ${{ secrets.YOUTUBE_UPLOAD }}
          YT_PRIVACY: ${{ secrets.YT_PRIVACY }}
        run: |
          cat > .env << EOF
          ANGEL_API_KEY=$ANGEL_API_KEY
          ANGEL_CLIENT_ID=$ANGEL_CLIENT_ID
          ANGEL_PASSWORD=$ANGEL_PASSWORD
          ANGEL_TOTP_SECRET=$ANGEL_TOTP_SECRET
          OPENROUTER_API_KEY=$OPENROUTER_API_KEY
          OPENROUTER_MODEL=$OPENROUTER_MODEL
          YOUTUBE_UPLOAD=$YOUTUBE_UPLOAD
          YT_PRIVACY=$YT_PRIVACY
          EOF

      - name: Generate and upload Shorts
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "${{ inputs.short }}" ]; then
            echo "Running Short ${{ inputs.short }}"
            python main_shorts.py --short "${{ inputs.short }}"

          elif [ "${{ inputs.demo }}" = "true" ]; then
            echo "Running in DEMO mode"
            python main_shorts.py --demo

          else
            echo "Running all 5 Shorts"
            python main_shorts.py
          fi

      - name: Upload generated Shorts as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: |
            output/shorts/
            logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f .env
          rm -f youtube_token.pickle
          rm -f client_secret.json